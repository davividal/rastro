# A workspace rather than one crate, so the boundaries are enforced by cargo
# instead of by a test. `rastro-fingerprint` and `rastro-collector` are the two
# an outside contributor depends on; `rastro` is the tool itself.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# A consequence of the dependencies, not a support promise. Rust ships every six
# weeks and maintains only the latest release, so no older version is "supported"
# by anyone. `subprocess` uses let-chains, stable since 1.88.
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/davividal/rastro"

[workspace.dependencies]
rastro-collector = { path = "crates/rastro-collector" }
rastro-fingerprint = { path = "crates/rastro-fingerprint" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
nix = { version = "0.31", features = ["signal"] }
serde_json = "1"
subprocess = "1"
thiserror = "2"
which = "8"

[profile.release]
strip = true
