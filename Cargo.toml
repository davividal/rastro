# A workspace rather than one crate, so the boundaries are enforced by cargo
# instead of by a test. `rastro-fingerprint` and `rastro-collector` are the two
# an outside contributor depends on; `rastro` is the tool itself.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# No `rust-version`: only the latest Rust is maintained, and under `resolver = "3"`
# a floor holds dependencies back to suit it. `mise.toml` pins what we build with.
license = "AGPL-3.0-only"
repository = "https://github.com/davividal/rastro"

# Declared once here and inherited by every member through `[lints] workspace = true`,
# rather than repeated as `#![deny(...)]` in four crate roots. The difference that
# matters is the crate nobody has written yet: it inherits these, where it would have
# been the one that forgot the attribute.
#
# `forbid` and not `deny` for unsafe. `deny` can be switched off again by an `#[allow]`
# further down the file, `forbid` cannot, and "this binary contains no unsafe" is a
# claim SECURITY.md makes about the whole workspace rather than about whichever crate
# roots still carry the attribute.
[workspace.lints.rust]
unsafe_code = "forbid"

# Only checked when the documentation is built, which is why `cargo doc` is a CI gate
# rather than a courtesy: a rename cannot leave a stale path behind.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.dependencies]
rastro-collector = { path = "crates/rastro-collector" }
rastro-fingerprint = { path = "crates/rastro-fingerprint" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.0"
libc = "0.2"
serde_json = "1"
# Pure Rust on purpose. `blake3` and `ring` build C and assembly through `cc`, which
# ends the cross-build from a macOS workstation to a musl target; `sha2` keeps it.
sha2 = "0.10"
subprocess = "1"
thiserror = "2"
# `Xxh3Digest` in the collector port, and pinned because it *is* part of the output format:
# changing the hash invalidates every archived fingerprint. XXH3 rather than sha2 or blake3
# because the inputs are ~80 bytes each and tens of thousands of them, where blake3's
# initialisation costs more than its throughput saves and XXH3 is the one built for the case.
# Not cryptographic, and it does not need to be: each digest is only ever compared with the
# same subject's on another run.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
strip = true
