# A workspace rather than one crate, so the boundaries are enforced by cargo
# instead of by a test. `rastro-fingerprint` and `rastro-collector` are the two
# an outside contributor depends on; `rastro` is the tool itself.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# No `rust-version`: only the latest Rust is maintained, and under `resolver = "3"`
# a floor holds dependencies back to suit it. `mise.toml` pins what we build with.
license = "AGPL-3.0-only"
repository = "https://github.com/davividal/rastro"

[workspace.dependencies]
rastro-collector = { path = "crates/rastro-collector" }
rastro-fingerprint = { path = "crates/rastro-fingerprint" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
libc = "0.2"
serde_json = "1"
subprocess = "1"
thiserror = "2"
which = "8"

[profile.release]
strip = true
