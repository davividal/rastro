sonar.projectKey=davividal_rastro
sonar.organization=davividal

# SonarCloud does not run Rust coverage itself; it imports the LCOV report
# generated in CI before the scan step.
sonar.rust.lcov.reportPaths=target/llvm-cov/lcov.info

# Without this the scanner uploads and exits, so the required `SonarQube` check passes
# on a red Quality Gate and the merge it guards proves nothing. The cost is that a
# SonarCloud outage becomes a merge outage.
sonar.qualitygate.wait=true


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=rastro
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
