[package]
name = "rastro"
description = "Emits a canonical, diffable fingerprint of a Linux host's state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["fingerprint", "drift", "state", "sysadmin", "devops"]
categories = ["command-line-utilities"]
publish = false

[lints]
workspace = true

[dependencies]
rastro-collector = { workspace = true }
rastro-fingerprint = { workspace = true }
clap = { workspace = true }
# For constants alone: `SIGKILL`, and the `O_NOFOLLOW`/`O_NONBLOCK` the Layer 1
# walker opens with. Already in the tree under `subprocess`.
libc = { workspace = true }
serde = { workspace = true }
# systemd, `ip` and `lsblk` all emit JSON on request, which is a format rastro
# chooses rather than a table it has to guess the columns of. Promoted from a
# dev-dependency for that: see `docs/decisions.md`.
serde_json = { workspace = true }
# Content hashing, which nothing does by default. Kept for the opt-in collector that
# will name the trees worth reading: see `docs/decisions.md`.
sha2 = { workspace = true }
# Shelling out to a canonical tool, hardened: `subprocess` bounds the time and the
# output of a run and can signal the child's whole process group.
subprocess = { workspace = true }
thiserror = { workspace = true }
# The digest of one entry's metadata, which is what the default view records per path.
toml = { workspace = true }
# Reading a certificate a virtual host serves, rather than only the path it lives at.
x509-parser = { workspace = true }

[dev-dependencies]
rastro-fingerprint = { workspace = true }
# `serde_json` is deliberately not repeated here. Tests read the rendered document
# back to assert on its shape, and a normal dependency is already visible to them.

# Excluded from `cargo test`, and run only by the job that provides an engine.
#
# It compares rastro's answer with docker's own, so it needs a live daemon with containers
# on it and **fails rather than skipping** when there is none: a check that quietly passes
# on a box with no engine is how a whole dialect rots unnoticed. That makes it wrong to run
# by default, because most boxes the suite runs on have no docker — the distributions legs
# are containers, and a dockerd inside one needs privilege the other legs deliberately do
# not have.
#
# `cargo test --test containers_conformance` still runs it, which is what
# `.github/workflows/live-engine.yml` does. Unlike `nginx_conformance`, which the suite can
# satisfy by installing nginx unprivileged, this one cannot be satisfied in a container.
[[test]]
name = "containers_conformance"
test = false
