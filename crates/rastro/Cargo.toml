[package]
name = "rastro"
description = "Emits a canonical, diffable fingerprint of a Linux host's state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["fingerprint", "drift", "state", "sysadmin", "devops"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
rastro-collector = { workspace = true }
rastro-fingerprint = { workspace = true }
clap = { workspace = true }
# For `SIGKILL` alone, as a constant. Already in the tree under `subprocess`.
libc = { workspace = true }
serde = { workspace = true }
# Shelling out to a canonical tool, hardened: `subprocess` bounds the time and the
# output of a run and can signal the child's whole process group.
subprocess = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
rastro-fingerprint = { workspace = true }
# Tests read the rendered document back to assert on its shape.
serde_json = { workspace = true }
