name: distributions

# The suite on Debian and on Alpine, as root and unprivileged. One tenant of the
# `extended-verification` tier, which every deep workflow enters through that one label.
# When to apply it: CONTRIBUTING.md.
#
# Not in `ci.yml` on cost: two images pulled and the workspace compiled four times, for a
# gate most changes cannot break. Here instead, where the cost is affordable — every push
# to master, nightly, on demand, and on a labelled pull request.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly, so a distribution moving underneath rastro is found by a scheduled run
    # naming the day it broke rather than by the next unrelated pull request.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    # Leads with a static word on purpose. Actions cannot interpolate a matrix value for
    # a job it skipped, so a name that is only `${{ matrix.host }}` reports the literal
    # string `matrix.host` in the checks list, which tells a reader nothing about what
    # was skipped.
    name: suite on ${{ matrix.host }}, root and unprivileged
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'extended-verification')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Debian and Alpine because the package sources differ: dpkg and apk are two
        # separate branches of the `packages` collector, and glibc and musl are two
        # different answers about what a filename is.
        #
        # `host` exists because the image tag does not say either of those things. A
        # check reading `rust:latest` leaves a reader to know that it means Debian and
        # glibc, and the whole point of this job is the difference between the two legs.
        #
        # Floating tags, deliberately, unlike the actions this repository pins by
        # commit. The question is whether rastro still works on today's Debian and
        # today's Alpine; a digest answers it about the day somebody wrote the digest.
        # A break here is news, which is what the nightly schedule is for.
        include:
          - image: rust:latest
            host: debian glibc
          - image: rust:alpine
            host: alpine musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The same script a working machine runs through `scripts/test-in-container.sh`,
      # so the two cannot drift. It runs the suite as root, then again as a user it
      # creates with no privilege at all: a container job is root by default, and
      # three defects have already hidden in that difference.
      #
      # No build cache. Everything is compiled inside the image, where
      # `Swatinem/rust-cache` has nothing to act on, and this job is rare enough that
      # mounting one would be more machinery than it saves.
      - name: Run the suite, privileged and unprivileged
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/w \
            -w /w \
            -e CARGO_TARGET_DIR=/tmp/target \
            ${{ matrix.image }} sh /w/scripts/container-suite.sh
