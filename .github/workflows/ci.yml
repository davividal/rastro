name: ci

on:
  push:
    branches: [master]
  pull_request:

# No job writes anything. Stated explicitly so the grant survives a change to
# the repository or organisation default.
permissions:
  contents: read

# A superseded push has nothing worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit rather than by tag, because a tag can be moved.
# The toolchain comes from `mise.toml`, so CI and a working machine cannot drift.
jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Doc links are only checked when the docs are built, which is what makes
      # `deny(rustdoc::broken_intra_doc_links)` in lib.rs bite.
      - run: cargo doc --locked --no-deps

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-llvm-cov
          fallback: none
      # SonarCloud imports Rust coverage from an external LCOV report; it never
      # computes that report during the scan itself.
      - run: mkdir -p target/llvm-cov && cargo llvm-cov --workspace --lcov --output-path target/llvm-cov/lcov.info --locked
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  supply-chain:
    name: advisories, licences, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Policy lives in `deny.toml`. The action is pinned to the commit its v2.1.1 tag
      # dereferences to, not to the annotated tag object, which would not resolve.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Root-level args, so they go here rather than in `command-arguments`, and the
          # action's own `--all-features` default has to be restated to keep it. `--locked`
          # matters most in this job of all: it is the one auditing the dependency graph, so
          # it must audit the same graph the other jobs build.
          arguments: --all-features --locked

  static-binary:
    name: musl static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install the musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl -p rastro
      # The single static binary is the product's core promise, so CI asserts it
      # rather than trusting the target triple.
      - name: Assert the binary is statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/rastro
          file target/x86_64-unknown-linux-musl/release/rastro | grep -q 'static'
      - run: ./target/x86_64-unknown-linux-musl/release/rastro --version
      # Keeps the binary downloadable from the run that built it, so it can be
      # scp'd to a box without waiting for a release pipeline.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rastro-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/rastro
          if-no-files-found: error
