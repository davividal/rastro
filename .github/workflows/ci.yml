name: ci

on:
  push:
    branches: [master]
  pull_request:

# Nothing by default, so a job holds only what it names for itself and a new job that
# names nothing can do nothing. An inherited default, repository or organisation wide,
# never reaches these jobs.
permissions: {}

# A superseded pull request has nothing worth finishing. A superseded master push does:
# a signal landing between `rolling-build`'s upload and its tag move would leave the two
# describing different commits, with no failed run to say so.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit rather than by tag, because a tag can be moved.
# The toolchain comes from `mise.toml`, so CI and a working machine cannot drift.
jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          # nextest runs each test in its own process, which is what keeps tests that
          # invoke the real binary from interfering through the filesystem. Measured at
          # 43 s against 64 s for libtest on the whole suite.
          tool: cargo-llvm-cov,cargo-nextest
          fallback: none
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # `--no-fail-fast` because nextest stops at the first failure by default, and a CI log
      # that reports one failure when there are four sends somebody round the loop three more
      # times. libtest ran everything, so this keeps that.
      # There is no separate test step: llvm-cov already runs the whole suite, only
      # instrumented, so a second invocation would buy a second identical run. The report
      # lands where `sonar-project.properties` looks for it, which is the only contract
      # this step has with the scan job.
      - run: mkdir -p target/llvm-cov && cargo llvm-cov nextest --workspace --lcov --output-path target/llvm-cov/lcov.info --locked --no-fail-fast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: target/llvm-cov/lcov.info
          if-no-files-found: error
      # Doc links are only checked when the docs are built, which is what makes
      # `deny(rustdoc::broken_intra_doc_links)` in lib.rs bite.
      - run: cargo doc --locked --no-deps

  # This job runs one distribution, as one unprivileged user. It therefore cannot
  # tell dpkg from apk, cannot see what the walk does as root, and cannot see a musl
  # host at all. `.github/workflows/container.yml` covers that: Debian and Alpine,
  # root and unprivileged, on every push to master, nightly, on demand, and on any
  # pull request carrying the `container` label. It compiles the workspace four times
  # over two pulled images, which is why it is not in front of every pull request.
  # **Add the `container` label** to one touching the walk, the `packages` collector,
  # anything reading /proc, the output file's mode, or the execution seam.

  # `cargo install` deliberately resolves without the workspace lockfile, and every
  # other job here passes `--locked`. So an upstream releasing a semver-compatible
  # version that does not build would break the path the README tells people to use,
  # and nothing else in this workflow would notice. Debug profile: this asks whether
  # a fresh graph resolves and compiles, not how fast the result runs.
  source-install:
    name: cargo install (fresh resolution)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install --path crates/rastro --debug --root target/source-install
      - run: target/source-install/bin/rastro --version

  # Differential: the action scans the commit range this push or pull request adds.
  # The whole reachable history is a separate question, asked weekly and on demand by
  # `.github/workflows/secret-scan.yml`, because scanning it on every pull request
  # would pay for 223 commits to learn about one.
  #
  # A fingerprint is sensitive operational data, and the fixtures in this repository
  # are host output. Something real arriving in one is a plausible accident rather
  # than a hypothetical, which is what this is here for. Policy lives in
  # `.gitleaks.toml`, at the root, so the same rules apply to a local gitleaks.
  secret-scan:
    name: secret scan (this push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # The action diffs a range, which a shallow clone does not have.
      # Free for a public repository under a personal account. Moving this repository
      # into an organisation would require a GITLEAKS_LICENSE, which is worth knowing
      # before the move rather than from the red run after it.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sonarqube:
    name: SonarQube
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Blame data: Sonar attributes new code by commit date.
      # SonarCloud never computes Rust coverage itself, it only imports a report, so the
      # scan depends on the one `check` produced rather than measuring anything here.
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: lcov
          path: target/llvm-cov
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  supply-chain:
    name: advisories, licences, sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Policy lives in `deny.toml`. The action is pinned to the commit its v2.1.1 tag
      # dereferences to, not to the annotated tag object, which would not resolve.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # These are cargo-deny's root-level args, hence `arguments` and not
          # `command-arguments`, and restating `--all-features` is what keeps the action's
          # own default. `--locked` matters most here of all four jobs: this is the one
          # auditing the dependency graph, so it must audit the graph the others build.
          arguments: --all-features --locked

  static-binary:
    name: ${{ matrix.target }} static build
    strategy:
      # One architecture failing to build says nothing about the other, and finding out
      # about both in one run beats two round trips.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          # A native runner rather than a cross build, because the smoke run below is the
          # point: a cross-built binary cannot be executed by the machine that built it.
          # There is no `-latest` alias for the arm64 runners, hence the pinned image.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Named explicitly so the two legs cannot land on one entry: the default key
          # covers the job but not which target within it produced the artifacts.
          key: ${{ matrix.target }}
      - name: Install the musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }} -p rastro
      # The single static binary is the product's core promise, so CI asserts it
      # rather than trusting the target triple.
      - name: Assert the binary is statically linked
        run: |
          file target/${{ matrix.target }}/release/rastro
          file target/${{ matrix.target }}/release/rastro | grep -q 'static'
      - run: ./target/${{ matrix.target }}/release/rastro --version
      # Keeps the binary downloadable from the run that built it, which is what a
      # pull request gets: `rolling-build` publishes master only.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # The artifact name is the published asset name, so `rolling-build` needs no
          # target list of its own and cannot drift from this matrix.
          name: rastro-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rastro
          if-no-files-found: error

  # The branch ruleset requires a context called `musl static build`, and a matrix reports
  # one check per leg under a name of its own, so matrixing the job retired that context
  # without saying so. A required check that is never reported blocks every pull request
  # rather than failing one. This job carries the old name so the ruleset needs no edit,
  # here or when a third architecture is added.
  static-binary-gate:
    name: musl static build
    needs: static-binary
    # Load-bearing: without it this job is skipped along with a dependency that failed or
    # was skipped, and a skipped required check does not block a merge the way a failed
    # one does. The step below is what turns the result into the verdict.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every architecture built
        run: |
          result='${{ needs.static-binary.result }}'
          echo "static-binary: $result"
          test "$result" = success

  # Republishes the `rolling` pre-release on every master push that passes the rest of
  # this workflow, so the newest build has one anonymous URL instead of living behind a
  # signed-in run page. Not a release: no version, no notes, no promise that yesterday's
  # bytes are still there.
  rolling-build:
    name: rolling development build
    # Every gating job, not just the one that produced the artifact: a binary people are
    # invited to curl and run as root should not come from a commit that failed a gate.
    # SonarQube counts, now that `sonar.qualitygate.wait` makes the job carry the verdict
    # rather than merely posting the analysis. So does the secret scan: a commit that
    # leaked a credential should not have its bytes handed out under an anonymous URL
    # while somebody works out what to rotate.
    needs: [check, sonarqube, supply-chain, static-binary, source-install, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Deliberately not granted to the job that compiles, where a build script of any
    # dependency would run beside a token that can push to the repository.
    permissions:
      contents: write
      # Provenance is signed against a short-lived OIDC identity rather than a stored key.
      id-token: write
      attestations: write
    env:
      # `gh` takes the repository from a git remote and from no environment variable of
      # its own, and this job has no checkout to give it one.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: rastro-*-unknown-linux-musl
          path: builds
          # One directory per artifact, not `merge-multiple`: every architecture's artifact
          # holds a file called `rastro`, so a merge would leave one overwriting the other.
          merge-multiple: false
      - name: Name and hash the assets
        run: |
          for directory in builds/*/; do
            asset=$(basename "$directory")
            mv "$directory/rastro" "$asset"
            sha256sum "$asset" > "$asset.sha256"
          done
      # The checksum only says the download did not corrupt, which is worth little when
      # the thing being downloaded is trusted with root. This binds the bytes to the
      # workflow and commit that produced them: `gh attestation verify` checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The pattern has to match a whole path, so it ends at the triple and the
          # checksum files sitting beside these are not attested as binaries.
          subject-path: rastro-*-unknown-linux-musl
      - name: Publish the build as the `rolling` pre-release
        run: |
          notes="Built from ${GITHUB_SHA}. Replaced on every push to master, and unrelated to any released version. Verify with \`gh attestation verify --repo $GH_REPO\`, then \`chmod +x\`."
          # Never deleted, only overwritten, so a publish that dies partway leaves a stale
          # `rolling` rather than a 404. Creation does anything only the first time.
          gh release create rolling --prerelease --target "$GITHUB_SHA" \
            --title "Rolling development build" --notes "$notes" || true
          # `--clobber` deletes an asset before uploading its replacement, and says so in
          # its own help: a transfer that fails takes the published file with it. So the
          # new bytes land under a temporary name, and only a completed upload displaces
          # what is already serving.
          for name in rastro-*-unknown-linux-musl*; do
            cp "$name" "$name.incoming"
            gh release upload rolling "$name.incoming" --clobber
            gh release delete-asset rolling "$name" --yes || true
            incoming_id=$(gh api "repos/$GH_REPO/releases/tags/rolling" \
              -q ".assets[] | select(.name == \"$name.incoming\") | .id")
            gh api -X PATCH "repos/$GH_REPO/releases/assets/$incoming_id" -f name="$name"
          done
          # A release ignores its target_commitish once its tag exists, so moving the tag
          # takes the refs API. It and the notes go last because both describe bytes that
          # are already uploaded.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/rolling" \
            -f sha="$GITHUB_SHA" -F force=true
          gh release edit rolling --notes "$notes"
