name: live broker

# rastro's account of a box's RabbitMQ against the broker's own. One tenant of the
# `extended-verification` tier, which every deep workflow enters through that one label.
# When to apply it: CONTRIBUTING.md.
#
# Why it cannot live in the suite the other legs run in, and this is measured rather than
# assumed: attributing a registered node to the process holding its distribution port means
# reading that process's descriptors, and podman's default capability set refuses that even
# to root (`CapEff: 800405fb`). Inside `scripts/container-suite.sh` the confirmed case is
# therefore unreachable, and a live broker there would be reported as undetermined. A GitHub
# runner with `sudo` has the full set, so the facet can be asked the one question the
# fixtures cannot answer for it.
#
# What this catches that the fixture tests cannot: a fixture captured wrong. Every other test
# of the `rabbitmq` facet asserts what rastro does with output somebody captured once, which
# pins the code against the author's own reading of it. This one asks the broker.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly, and deliberately not at the same minute as the other deep workflows, so a
    # RabbitMQ release changing an answer underneath rastro is found by a run naming the day
    # it broke rather than by the next unrelated pull request.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: rabbitmq against a live broker
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'extended-verification')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the broker
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            rabbitmq-server

      - name: Report which broker answered
        run: |
          sudo rabbitmqctl await_startup
          sudo rabbitmqctl version
          sudo rabbitmq-diagnostics erlang_version
          sudo epmd -names

      # The conformance test compares lists and fails when one is empty, so the broker has to
      # hold something first. A vhost, a user with a password (hence a real verifier to
      # withhold), permissions, a policy, a durable quorum queue, an exchange and a binding:
      # one of each thing the definitions half reports.
      - name: Give the broker something to describe
        run: |
          cat > /tmp/seed.json <<'JSON'
          {"vhosts":[{"name":"conformance"}],
           "users":[{"name":"conformance-user","password":"hunter2","tags":["monitoring"]}],
           "permissions":[{"user":"conformance-user","vhost":"conformance","configure":"^c.*","write":".*","read":".*"}],
           "topic_permissions":[{"user":"conformance-user","vhost":"conformance","exchange":"amq.topic","write":"^a","read":"^b"}],
           "policies":[{"vhost":"conformance","name":"capped","pattern":"^work","apply-to":"queues","definition":{"max-length":1000},"priority":1}],
           "queues":[{"name":"work","vhost":"conformance","durable":true,"auto_delete":false,"arguments":{"x-queue-type":"quorum"}}],
           "exchanges":[{"name":"conformance.direct","vhost":"conformance","type":"direct","durable":true,"auto_delete":false,"arguments":{}}],
           "bindings":[{"source":"conformance.direct","vhost":"conformance","destination":"work","destination_type":"queue","routing_key":"k","arguments":{}}]}
          JSON
          sudo rabbitmqctl import_definitions /tmp/seed.json
          # A shovel keeps its peer's password inside a URI, which is the case the facet
          # withholds every parameter value for.
          sudo rabbitmq-plugins enable rabbitmq_shovel
          sudo rabbitmqctl set_parameter shovel conformance-shovel \
            '{"src-protocol":"amqp091","src-uri":"amqp://shovel-user:hunter2@upstream.example.com","src-queue":"in","dest-protocol":"amqp091","dest-uri":"amqp://localhost","dest-queue":"out"}'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # As root, because that is what rastro is on a production box and what the attribution
      # needs: the broker's beam is owned by `rabbitmq`, so an unprivileged run cannot read
      # its descriptors and every node would come back undetermined. Its own target directory
      # keeps the root-owned artefacts out of the one the step below uses.
      - name: Compare rastro's answer with the broker's
        run: |
          sudo -E env "CARGO_TARGET_DIR=/tmp/conformance-target" \
            "$(command -v cargo)" test --locked --test rabbitmq_conformance

      # The facet's own tests too, on a box that has a broker: they are fixture-driven and
      # pass anywhere, but a run here proves the detection finds a real node rather than only
      # a `/proc` a test wrote.
      - name: Run the facet's own tests where a broker exists
        run: |
          cargo test --locked --test rabbitmq --test rabbitmq_asking --test rabbitmq_definitions \
            --test rabbitmq_inventory --test rabbitmq_register --test rabbitmq_residency \
            --test rabbitmq_status --test proc_sockets

      # The whole point of the facet, asserted through the shipped binary rather than a unit:
      # two runs of a box nobody touched render the same bytes.
      - name: Two runs of an unchanged broker are identical
        run: |
          sudo -E env "CARGO_TARGET_DIR=/tmp/conformance-target" \
            "$(command -v cargo)" run --locked --quiet -- -o /tmp/first.json
          sudo -E env "CARGO_TARGET_DIR=/tmp/conformance-target" \
            "$(command -v cargo)" run --locked --quiet -- -o /tmp/second.json
          sudo python3 - <<'PY'
          import json, sys
          def facet(path):
              with open(path) as document:
                  return next(f for f in json.load(document)['facets'] if f['name'] == 'rabbitmq')
          first, second = facet('/tmp/first.json'), facet('/tmp/second.json')
          if first != second:
              print('the rabbitmq facet differs between two runs of an unchanged box')
              print(json.dumps(first, indent=1, sort_keys=True))
              print(json.dumps(second, indent=1, sort_keys=True))
              sys.exit(1)
          print('identical')
          PY
