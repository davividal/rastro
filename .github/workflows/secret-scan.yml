name: full-history secret scan

# The whole reachable history, weekly and on demand. `ci.yml` scans only the range a
# push or pull request adds, which is the right trade for a gate in front of every
# change and says nothing about a credential that landed before the scan existed.
#
# The two also answer different questions over time: a rule added to `.gitleaks.toml`
# next month applies to the whole history here, and to nothing at all in a
# differential scan of a range that predates it.

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # A schedule or a manual dispatch is what makes this action scan everything
      # reachable rather than a range: it has no pushed commits to diff.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
