# Components and the musl targets are declared here rather than installed by a CI step,
# so a working machine and CI get the same toolchain from one place. Both shipped
# architectures are listed for every machine, even though each release build uses one of
# them: a single list is what stops a runner from silently lacking the target it needs.
#
# They are not optional extras. With neither `components` nor `profile` set, mise runs a
# bare `rustup toolchain install` and rustup falls back to its own configured default
# profile, which on a GitHub runner is `minimal`. `cargo fmt` and `cargo clippy` would
# then fail there while passing locally.
#
# `llvm-tools`, not `llvm-tools-preview`: rustup accepts the -preview alias on install but
# reports the component under its plain name, and mise compares the two strings literally,
# so the alias leaves it warning "missing: rust@1.97.1" on every prompt.
[tools.rust]
version = "1.97.1"
components = ["clippy", "rustfmt", "llvm-tools"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
